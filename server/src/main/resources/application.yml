server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/safesupport;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

app:
  mail:
    # 发件人，默认与登录账号一致
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    # 家属未填邮箱时的兜底收件地址，多个用逗号分隔，随机选择一个发送；留空则该家属跳过发送
    test-recipients: ${MAIL_TEST_TO:472881806@qq.com,renfx68@gmail.com}
  notify:
    # 定时任务扫描到期申请的间隔（毫秒）
    poll-interval-ms: 60000
    # 应用启动后延迟多久开始首轮扫描
    initial-delay-ms: 30000
    # 单条申请最多尝试轮次，超过后标记 FAILED
    max-attempts: 5
  cors:
    # 允许跨域的来源，多个用逗号分隔；App/桌面端默认全部放行
    allowed-origins: ${CORS_ORIGINS:*}

logging:
  level:
    com.safesupport: INFO
