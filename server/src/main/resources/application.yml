server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/safesupport;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

app:
  mail:
    # 发件人，默认与登录账号一致
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    # 家属未填邮箱时的兜底收件地址，留空则该家属跳过发送
    test-recipient: ${MAIL_TEST_TO:}

logging:
  level:
    com.safesupport: INFO
